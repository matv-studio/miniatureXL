# Miniature XL 1.0
# Based on Miniature Shader 2.19 by Mateus A. Kreuch (MIT License - see LICENSE)
# XL additions: selective glow, voxel colored lighting (all dimensions),
# entity/item lights, sky colors, day-night shadows, Voxy integration
profile.LOWEST=SHADOW_ENTITY=1 !FLAT_LIGHTING !ENABLE_SHADOWS BLOCK_REFLECTIONS=0 SSR_STEP_SIZE=1.6 SSR_MAX_STEPS=10 SSR_BINARY_STEPS=4 !BLOOM BLOOM_QUALITY=0 !COLORED_LIGHT
profile.LOW=profile.LOWEST shadowMapResolution=256 shadowDistance=64.0 shadowIntervalSize=7.0 SHADOW_ENTITY=-1 FLAT_LIGHTING ENABLE_SHADOWS BLOOM COLORED_LIGHT
profile.NORMAL=profile.LOW shadowMapResolution=1024 shadowDistance=128.0 SHADOW_ENTITY=0 BLOCK_REFLECTIONS=5 BLOOM_QUALITY=1
profile.HIGH=profile.NORMAL shadowMapResolution=4096 shadowDistance=384.0 SHADOW_ENTITY=1 SSR_STEP_SIZE=1.2 SSR_MAX_STEPS=16 SSR_BINARY_STEPS=8 BLOOM_QUALITY=2

screen=<profile> [SHADOWS_SCREEN] <empty> [REFLECTIONS_SCREEN] <empty> [WATER_SCREEN] <empty> [ATMOSPHERE_SCREEN] <empty> [BLOOM_SCREEN] <empty> [COLORED_LIGHT_SCREEN] <empty> [OTHER_SCREEN]

screen.REFLECTIONS_SCREEN=REFLECTIONS SSR_STEP_SIZE BLOCK_REFLECTIONS SSR_MAX_STEPS <empty> SSR_BINARY_STEPS
screen.WATER_SCREEN=WATER_WAVE_SIZE WATER_BRIGHTNESS WATER_WAVE_SPEED WATER_B <empty> WATER_A <empty> <empty> <empty> WATER_MIN_GLINT <empty> WATER_GLINT_CUTOFF <empty> WATER_GLINT_BRIGHTNESS
screen.ATMOSPHERE_SCREEN=ENABLE_SKY WEATHER_OPACITY ENABLE_FOG OVERWORLD_FOG_MIN_SLIDER <empty> OVERWORLD_FOG_MAX_SLIDER SUN_SHAFTS SUN_SHAFTS_STRENGTH <empty> <empty> <empty> END_STARS_SPEED <empty> END_STARS_AMOUNT <empty> END_STARS_OPACITY
screen.SHADOWS_SCREEN=ENABLE_SHADOWS FLAT_LIGHTING SHADOW_ENTITY sunPathRotation <empty> <empty> shadowDistance LIGHT_BRIGHTNESS shadowMapResolution SHADOW_DARKNESS shadowIntervalSize SHADOW_BLUENESS entityShadowDistanceMul SHADOW_PIXEL
screen.OTHER_SCREEN=<empty> HAND_DYNAMIC_LIGHTING <empty> GLOWING_ORES <empty> HIGHLIGHT_WAXED <empty> NETHER_COLOR_GRADING
screen.BLOOM_SCREEN=BLOOM BLOOM_QUALITY BLOOM_STRENGTH BLOOM_RADIUS BLOOM_SATURATION BLOOM_SOURCE_COLOR BLOOM_PIXEL_THRESHOLD BLOOM_ENCHANT <empty> <empty> BLOOM_EMISSIVE_TEXTURES BLOOM_PARTICLES BLOOM_SKY <empty> BLOOM_HIGHLIGHTS BLOOM_THRESHOLD
screen.COLORED_LIGHT_SCREEN=COLORED_LIGHT COLORED_LIGHT_STRENGTH CL_ENTITY_LIGHT CL_ITEM_LIGHT COLORED_LIGHT_RANGE CL_FALLOFF VOXEL_SIZE TORCH_FALLOFF CL_TRANSITION CL_LAVA_TEXTURE [CL_COLORS_SCREEN] [SKY_COLORS_SCREEN]
screen.CL_COLORS_SCREEN=CL_FLAME_R CL_FLAME_G CL_FLAME_B CL_SOUL_R CL_SOUL_G CL_SOUL_B CL_LAVA_R CL_LAVA_G CL_LAVA_B CL_REDSTONE_R CL_REDSTONE_G CL_REDSTONE_B CL_AMETHYST_R CL_AMETHYST_G CL_AMETHYST_B CL_SEA_R CL_SEA_G CL_SEA_B CL_PORTAL_R CL_PORTAL_G CL_PORTAL_B CL_GLOW_R CL_GLOW_G CL_GLOW_B CL_ROD_R CL_ROD_G CL_ROD_B CL_LICHEN_R CL_LICHEN_G CL_LICHEN_B
screen.CL_COLORS_SCREEN.columns=3
screen.SKY_COLORS_SCREEN=SUN_NOON_R SUN_NOON_G SUN_NOON_B SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B MOON_R MOON_G MOON_B <empty> <empty> <empty> SKY_DAY_R SKY_DAY_G SKY_DAY_B SKY_DUSK_R SKY_DUSK_G SKY_DUSK_B SKY_NIGHT_R SKY_NIGHT_G SKY_NIGHT_B
screen.SKY_COLORS_SCREEN.columns=3

sliders=LIGHT_BRIGHTNESS SHADOW_DARKNESS WATER_BRIGHTNESS WATER_B WATER_A shadowDistance OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER SHADOW_BLUENESS shadowMapResolution SHADOW_PIXEL REFLECTIONS WATER_MIN_GLINT WATER_WAVE_SIZE WATER_WAVE_SPEED shadowIntervalSize entityShadowDistanceMul sunPathRotation MOON_R MOON_G MOON_B END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY WEATHER_OPACITY SSR_MAX_STEPS SSR_STEP_SIZE SSR_BINARY_STEPS BLOCK_REFLECTIONS WATER_GLINT_CUTOFF WATER_GLINT_BRIGHTNESS BLOOM_STRENGTH BLOOM_RADIUS BLOOM_HIGHLIGHTS BLOOM_THRESHOLD BLOOM_SOURCE_COLOR BLOOM_SATURATION BLOOM_PIXEL_THRESHOLD COLORED_LIGHT_STRENGTH SUN_SHAFTS_STRENGTH CL_FLAME_R CL_FLAME_G CL_FLAME_B CL_SOUL_R CL_SOUL_G CL_SOUL_B CL_LAVA_R CL_LAVA_G CL_LAVA_B CL_REDSTONE_R CL_REDSTONE_G CL_REDSTONE_B CL_AMETHYST_R CL_AMETHYST_G CL_AMETHYST_B CL_SEA_R CL_SEA_G CL_SEA_B CL_PORTAL_R CL_PORTAL_G CL_PORTAL_B CL_GLOW_R CL_GLOW_G CL_GLOW_B CL_ROD_R CL_ROD_G CL_ROD_B CL_LICHEN_R CL_LICHEN_G CL_LICHEN_B COLORED_LIGHT_RANGE CL_FALLOFF VOXEL_SIZE TORCH_FALLOFF CL_TRANSITION SUN_NOON_R SUN_NOON_G SUN_NOON_B SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B SKY_DAY_R SKY_DAY_G SKY_DAY_B SKY_DUSK_R SKY_DUSK_G SKY_DUSK_B SKY_NIGHT_R SKY_NIGHT_G SKY_NIGHT_B

oldHandLight=true
# glint blends with (SRC_COLOR, ONE); the glow buffer needs plain additive
blend.gbuffers_armor_glint.colortex2=ONE ONE ONE ONE
# translucents REPLACE the glow buffer instead of alpha-blending into it:
# non-emitters (tinted/stained glass, water, ice) write zero and thereby purge
# any foreign glow left at those pixels (Voxy LOD draws leave glow garbage
# that the composite depth-kill only hides while no translucent writes depth
# in front); emitters (nether portal) still write their own glow
blend.gbuffers_water.colortex2=ONE ZERO ONE ZERO
separateAo=true
beacon.beam.depth=true
rain.depth=false
particles.ordering=mixed
occlusion.culling=true
oldLighting=false

# entity colored light is voxelized IN THE SHADOW PASS (the only pass Iris
# gives us a light-source position for). if entities are not rendered there,
# no burning mob, dropped item or entity-carried light can ever emit - so the
# entity/item light toggles force them on, whatever the entity shadow setting
#if defined COLORED_LIGHT && (defined CL_ENTITY_LIGHT || defined CL_ITEM_LIGHT)
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true
#else
#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif
#endif

iris.features.optional=BLOCK_EMISSION_ATTRIBUTE COMPUTE_SHADERS CUSTOM_IMAGES REVERSED_CULLING

#if defined IS_IRIS && defined COLORED_LIGHT
shadow.culling=reversed
#else
program.world0/shadowcomp.enabled=false
program.world-1/shadowcomp.enabled=false
program.world1/shadowcomp.enabled=false
# without colored light the Nether/End shadow passes have no purpose (no shadows there)
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false
#endif

# voxel volume declarations: flat #if blocks only (no #elif - unsupported by
# some shaders.properties parsers). sizes must mirror VOXEL_SIZE/VOXEL_HEIGHT
#if defined IS_IRIS && defined COLORED_LIGHT
#if VOXEL_SIZE == 64
image.voxelData = voxelDataSampler rgba rgba8 float true false 64 64 64
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 64 64 64
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 64 64 64
#endif
#if VOXEL_SIZE == 128
image.voxelData = voxelDataSampler rgba rgba8 float true false 128 64 128
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 128 64 128
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 128 64 128
#endif
#if VOXEL_SIZE == 192
image.voxelData = voxelDataSampler rgba rgba8 float true false 192 64 192
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 192 64 192
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 192 64 192
#endif
#if VOXEL_SIZE == 256
image.voxelData = voxelDataSampler rgba rgba8 float true false 256 64 256
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 256 64 256
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 256 64 256
#endif
#if VOXEL_SIZE == 384
image.voxelData = voxelDataSampler rgba rgba8 float true false 384 128 384
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 384 128 384
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 384 128 384
#endif
#if VOXEL_SIZE == 512
image.voxelData = voxelDataSampler rgba rgba8 float true false 512 128 512
image.voxelLight = voxelLightSampler rgba rgba16f half_float false false 512 128 512
image.voxelLightAlt = voxelLightAltSampler rgba rgba16f half_float false false 512 128 512
#endif
#endif

#ifdef BLOOM
#if BLOOM_QUALITY == 0
size.buffer.colortex3=0.25 0.25
#else
size.buffer.colortex3=0.5 0.5
#endif
#else
program.world0/composite.enabled=false
program.world0/composite1.enabled=false
program.world1/composite.enabled=false
program.world1/composite1.enabled=false
program.world-1/composite.enabled=false
program.world-1/composite1.enabled=false
#endif

#if MC_VERSION < 12111
program.world-1/gbuffers_line.enabled=false
program.world0/gbuffers_line.enabled=false
program.world1/gbuffers_line.enabled=false
#endif

#if !defined BLOOM || !defined BLOOM_PARTICLES
program.world0/gbuffers_textured.enabled=false
program.world1/gbuffers_textured.enabled=false
program.world-1/gbuffers_textured.enabled=false
#endif

#if MC_VERSION < 11700 || !defined IS_IRIS || !defined ENABLE_SKY
program.world0/gbuffers_clouds.enabled=false
program.world0/gbuffers_skybasic.enabled=false
#endif