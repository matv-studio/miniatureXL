entity.11000 = lightning_bolt

# colored light voxelization: entity ids read via the entityId uniform in the
# shadow pass (requires Entity shadows = All so entities render there)
# 10301 dropped items, 10303 item frames  -> CL_ITEM_LIGHT
# 10302 flame overlay on any burning entity (incl. flaming arrows),
# 10304/10305 intrinsically glowing mobs   -> CL_ENTITY_LIGHT
entity.10301 = minecraft:item
entity.10302 = minecraft:entity_flame
entity.10303 = minecraft:item_frame minecraft:glow_item_frame
entity.10304 = minecraft:blaze minecraft:magma_cube
entity.10305 = minecraft:glow_squid minecraft:allay
