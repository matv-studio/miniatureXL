name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  glsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools

      - name: Compile every program in every option combination
        run: python3 check.py

  package:
    needs: glsl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the shaderpack zip
        run: zip -qr MiniatureXL.zip shaders LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: MiniatureXL
          path: MiniatureXL.zip
